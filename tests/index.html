<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Browser-based functional tests for Commit." />
    <title>Commit — Browser tests</title>
    <style>
      body { max-width: 760px; margin: 40px auto; padding: 0 18px; color: #202823; font: 15px/1.5 "Segoe UI", Arial, sans-serif; }
      h1 { margin-bottom: 4px; font-size: 24px; }
      p { color: #626a63; }
      #results { padding-left: 22px; }
      #results li { margin: 7px 0; }
      .pass { color: #315f45; }
      .fail { color: #a53f35; }
      #test-app { position: absolute; width: 1px; height: 1px; border: 0; clip-path: inset(50%); }
      #summary { font-weight: 700; }
    </style>
    <script src="tests.js?v=1" defer></script>
  </head>
  <body>
    <h1>Commit browser tests</h1>
    <p>Runs task creation, editing, date filters, completion, undo, and browser-storage checks in an isolated app frame.</p>
    <p id="summary" role="status">Preparing tests…</p>
    <ol id="results"></ol>
    <iframe id="test-app" title="Commit test app"></iframe>
  </body>
</html>
